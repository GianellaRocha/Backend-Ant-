services:
  db:
    image: postgres:16-alpine
    container_name: antu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mipassword
      POSTGRES_DB: antu_db
    ports:
      - '5432:5432'
    volumes:
      - antu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d antu_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  antu_pgdata: